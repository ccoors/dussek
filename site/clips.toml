[[clip]]
id = "mutes"
page = "weidinger"
section = "feature"
title = "Mutes"
instrument = "trumpet"
midi = "f-brass"
listen = "The same line open and with five mutes: straight, cup, wah, bucket, and the plunger, the hand opening wider the harder a note is played."
match = "together"
steps = [
  { label = "Open", set = { brass_mute = 0 } },
  { label = "Straight", set = { brass_mute = 1 } },
  { label = "Cup", set = { brass_mute = 2 } },
  { label = "Wah", set = { brass_mute = 3 } },
  { label = "Bucket", set = { brass_mute = 5 } },
  { label = "Plunger", set = { brass_mute = 6 } },
]

[[clip]]
id = "brass-dynamics"
page = "weidinger"
section = "feature"
title = "Dynamics"
instrument = "trumpet"
midi = "f-brass"
listen = "The same line soft, medium and loud: more air, and the sound grows brighter as well as louder."
match = "together"
steps = [
  { label = "Soft", midi = "f-brass-soft" },
  { label = "Medium" },
  { label = "Loud", midi = "f-brass-loud" },
]

[[clip]]
id = "growl-flutter"
page = "weidinger"
section = "feature"
title = "Growl and flutter"
instrument = "trumpet"
midi = "f-brass"
listen = "The throat's rough edge on the air, then the tongue rolling, cutting the air about 25 times a second."
match = "together"
steps = [
  { label = "Plain" },
  { label = "Growl", set = { growl = 70 } },
  { label = "Flutter", set = { flutter = 80 } },
]

[[clip]]
id = "brass-vibrato"
page = "weidinger"
section = "feature"
title = "Vibrato"
instrument = "trumpet"
midi = "f-brass"
listen = "The virtual player's own vibrato, coming in on a held note; a set one, wider; and the player off, the air from the keys alone, as a wind controller would give it."
match = "together"
steps = [
  { label = "The player's" },
  { label = "Wide", set = { brass_vibrato = 60 } },
  { label = "No virtual player", set = { virtual_player = 0 } },
]

[[clip]]
id = "glide"
page = "weidinger"
section = "feature"
title = "The slide"
instrument = "tenor_trombone"
midi = "f-glide"
listen = "The tenor trombone's slurs by the lips, then by the slide: every slur within a tritone glides."
match = "together"
steps = [
  { label = "By the lips", set = { glide_mode = 0 } },
  { label = "By the slide", set = { glide_mode = 2 } },
]

[[clip]]
id = "section"
page = "weidinger"
section = "feature"
title = "A section"
instrument = "trumpet"
midi = "f-brass-chords"
listen = "Three chords: in Auto each becomes a section of trumpets, one player a note; in Solo one player takes the last key."
match = "together"
steps = [
  { label = "Auto", set = { brass_solo = 0 } },
  { label = "Solo", set = { brass_solo = 1 } },
]

[[clip]]
id = "brass-mics"
page = "weidinger"
section = "feature"
title = "Microphones"
instrument = "horn"
midi = "f-brass-horn"
listen = "The horn's bell points back and to the player's right: 6 m in front (the default) it is darker, at the player's ears and 30 cm on the bell's axis brighter. All at the same loudness."
match = "each"
steps = [
  { label = "Audience", set = { mic_position = 2 } },
  { label = "Player", set = { mic_position = 1 } },
  { label = "Close 1", set = { mic_position = 3 } },
]

[[clip]]
id = "sad-trumpet"
page = "weidinger"
section = "feature"
title = "Wah-wah-waaah"
instrument = "trumpet"
midi = "f-sad-trumpet"
listen = "The plunger by hand (CC 4): three notes falling, the hand opening during each, the last one long with a widening vibrato. The sound of a plan failing."
steps = [{ label = "Wah-wah-waaah", set = { brass_mute = 6 } }]
