# The website's clips, rendered by site/render.py (`--check` checks this table only).
#
# A clip: `id`, `section` (demo, piece, performance, feature), `title`, `instrument` (a folder of
# instruments/), `midi` (a phrase of site/midi by name, or a path from the repository's root);
# optional: `set` (plugin controls by symbol, in their own units: what the plugin plays, through
# its Copy CLI line), `tail` (seconds after the last event, default 4), `seconds` (cut after so
# many, faded), `listen` (what to listen for), `license` (shown with the clip; default CC0), `short`
# (a shorter name where space is tight), `page` ("dussek", the default, or "weidinger": the brass's page).
# A step's `source` from an album's renders (albums/brass/out/) is rendered first when missing.
# A feature lists `steps`, each a variant of the clip (`label`, and any of `instrument`, `midi`,
# `set`, `morph`, `input` a sound into the audio input, `source` a sound file played as it is);
# `match`: "together" (one gain for all steps: their differences in level stay) or "each" (every
# step at the same loudness).

# ---- one demo per menu group, on the group's best (the maintainer's ear decides)

