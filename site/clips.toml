# ---- the features: the same phrase plain, then with the feature

[[clip]]
id = "condition"
section = "feature"
title = "Condition"
instrument = "grand_a"
midi = "f-piano"
listen = "The same grand mint, worn and broken: the hammers harden, the unisons drift apart, the dampers and the action get noisy."
match = "together"
steps = [
  { label = "Mint", set = { condition = 0 } },
  { label = "Worn", set = { condition = 35 } },
  { label = "Broken", set = { condition = 100 } },
]

[[clip]]
id = "preparations"
section = "feature"
title = "Preparations"
instrument = "grand_a"
midi = "f-piano"
listen = "Things done to the strings: paper laid over them (a buzz), the strings plucked instead of struck."
match = "together"
steps = [
  { label = "None", set = { preparation = 0 } },
  { label = "Paper", set = { preparation = 5 } },
  { label = "Plucked", set = { preparation = 1 } },
]

[[clip]]
id = "audio-input"
section = "feature"
title = "Audio input"
instrument = "grand_a"
midi = "silence"
tail = 10
listen = "A sound sung into the strings: with the dampers lifted, the strings that share its pitches ring on after it has stopped. Both at the same loudness."
match = "each"
steps = [
  { label = "The sound", source = "site/sounds/falling.ogg" },
  { label = "Grand A ringing to it", input = "site/sounds/falling.ogg", set = { audio_input = 0, sustain_latch = 1 } },
]

[[clip]]
id = "morph"
section = "feature"
title = "Morphing"
instrument = "grand_a"
midi = "f-piano"
listen = "Grand A, then an instrument halfway to Grand B that no recording holds."
match = "together"
steps = [
  { label = "Grand A" },
  { label = "Halfway to Grand B", morph = ["instruments/grand_b=0.5"] },
]

[[clip]]
id = "pedals"
section = "feature"
title = "Pedals"
instrument = "grand_a"
midi = "f-piano"
listen = "No pedal, the sustain pedal changed with the harmony, the sostenuto holding only the first chord."
match = "together"
steps = [
  { label = "No pedal", midi = "f-piano-dry" },
  { label = "Pedal", midi = "f-piano" },
  { label = "Sostenuto", midi = "f-piano-sostenuto" },
]

[[clip]]
id = "motor"
section = "feature"
title = "Vibraphone motor"
instrument = "vibraphone"
midi = "f-mallets"
listen = "The vibraphone's fans: still, then turning (the tremolo)."
match = "together"
steps = [
  { label = "Motor off", set = { motor = 0 } },
  { label = "Motor on", set = { motor = 1 } },
]

[[clip]]
id = "stops"
section = "feature"
title = "Harpsichord stops"
instrument = "flemish"
midi = "f-harpsichord"
listen = "Harpsichord B plain, with the buff (pads on the strings: short and dark) and with the lute (plucked near the nut: nasal)."
match = "together"
steps = [
  { label = "Plain" },
  { label = "Buff", set = { buff = 1 } },
  { label = "Lute", set = { lute = 1 } },
]

[[clip]]
id = "bebung"
section = "feature"
title = "Bebung"
instrument = "clavichord"
midi = "f-clavichord"
listen = "The clavichord's vibrato: the player's finger presses the key harder and softer, the tangent pulls the string's pitch."
match = "together"
steps = [
  { label = "Plain", midi = "f-clavichord-plain" },
  { label = "Bebung", midi = "f-clavichord" },
]

[[clip]]
id = "temperament"
section = "feature"
title = "Temperament"
instrument = "grand_a"
midi = "f-chords"
listen = "A cadence in C, in equal temperament and in quarter-comma meantone: the thirds settle and stop beating."
match = "together"
steps = [
  { label = "Equal", set = { temperament = 0 } },
  { label = "Meantone 1/4 comma", set = { temperament = 1 } },
]

