# Iowa MIS percussion (anechoic, 2013): octave runs split per note by analysis/split_runs.py
# the marimba (no dampers): normal strokes with yarn, cord and rubber mallets
[project]
# recorded anechoic (Iowa MIS): the Compare page renders it without a room, as it was recorded
recorded_dry = true
family = "bars"
body = "marimba"

[menu]
name = "Marimba"
group = "Percussion"
# the mallets' names as the menu shows them (the file's are the fits' ids)
mallets = ["Yarn", "Cord", "Rubber"]

# the marimba's cutoff scales with the bar (`cutoff_scale`): in the same 1–2 kHz the treble's
# fundamentals rise 6 dB from mf to ff, the middle's second modes 20
# the third mode stays at 9.9–10.1 where it is found (±25 % took 2·f2 at 7.98 near C4)
[bars]
tracks = [1.0, 4.0, 10.0, 18.7]
tol = [0.03, 0.12, 0.1, 0.06]
scale_cutoff = true

# the marimba: each mode from zero over 0.5 ms (MARIMBA_ONSET_S)
# the marimba's and the kalimba's modes also stepped at the strike: in its first 0.2 ms the marimba
# reached 0.19 of the strike's peak (the recordings 0.07; 1 ms frames already as recorded), the
# kalimba 0.64 (0.02: the recordings rise over ~6 ms, the tine coming in at 7 ms). From zero over
# 0.5 ms (0.05) and 4 ms (0.03; 8 ms only 2–4 dB nearer in the first frames): preferred by ear
[export]
# the level by loudness (2026-10-27, design log step 173): a phrase in its middle (an arpeggio at
# velocity 80, chords at 95) lay +14.3 dB re the grands' median (-28.9 LUFS, EBU R128); the
# calibration sets the median key's ff peak, and held tones sound louder than struck ones at one peak
gain_db = -14.5
motor = false
onset_s = 0.0005

[[part]]
id = "marimba"

[[part.source]]
id = "marimba_yarn"
role = "mallet"
mallet = "yarn"
root = "iowa-mis-percussion"
dynamics = { pp = "pp", mf = "mf", ff = "ff" }
levels = "normalized"
# the Iowa runs: true levels within each octave run, each run at its own gain or touch (the
# marimba's yarn pp C6–B6 9 dB over the runs around it): level corrections within a run only
level_groups = "octave"

[part.source.map]
kind = "pattern"
glob = "notes/marimba.yarn/*/*.wav"
match = "relpath"
regex = 'notes/marimba\.yarn/(?P<dynamic>pp|mf|ff)/(?P<midi>\d+)\.wav'
note = { group = "midi", style = "midi" }
layers = ["pp", "mf", "ff"]
order = "layer"

# from the Compare page, 2026-10-15: dB per recorded key, each octave run re its neighbors (level_groups), smoothed (running median over 5 keys, then ¼ ½ ¼); the export interpolates between the keys and holds the ends
