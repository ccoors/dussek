# Grand D: Ivy Audio's Piano in 162 ("free for personal or commercial use"),
# close microphones, pedal up, take 1: NN-PedalOff<Dynamic>1Close.flac (NN 01–88: A0–C8)
[project]
family = "struck"
skip = ["release_noise", "dampers", "pedal_noise"]
body = "grand"

[menu]
name = "Grand D"
group = "Grand pianos"

[strings]
design = "grand"
board_seed = 10
detune = 1.0
id_max_partial = 60
# the per-key correction fitted in bands above the tracked partials too (soundboard.py, as Grand A's):
# without them the bass keys' correction above their 60th partial (2.9 kHz at A0) was the edge value
# carried on, +11 … +19 dB at 2–8 kHz (the board investigation, 2026-10-21)
band_correction = true

[uses]
dampers = "grand_e"
release = "grand_a"
pedal = "grand_a"

[[part]]
id = "grand_d"

[[part.source]]
id = "grand_d"
role = "main"
root = "piano-in-162"
# pp, mp and f of its five layers (velocities 0–33, 65–80, 102–127), played by the engine at
# MIDI 14, 60, 124: with Ivy's mf (81–101) at 60 the level rose 21 dB to MIDI 60 and 8 dB
# above; with p (34–64, 5 dB over pp) 3 dB to 60 and 29 dB above; mp: 13 and 17 dB
dynamics = { pp = "pp", mf = "mp", ff = "f" }
levels = "recorded"
# each layer was recorded at its own gain. The noise floor sits a constant 4–12 dB above the
# mf layer's, in every octave band 31 Hz–16 kHz and within ±0.7 dB from note to note (floor
# 1–8 kHz, the quietest 0.5 s of each file's second half; the second take has gains of its own);
# a file's levels are its own minus gain_db, so the levels between layers are real: pp −21,
# p −16, mp −8, f +9 dB re mf at the attack (raw −17 … +15, mp level with mf)
gain_db = { pp = 4.4, mp = 6.5, f = 6.5 }

[part.source.map]
kind = "pattern"
glob = "Piano in 162 Samples/Close/PedalOffClose/*.flac"
regex = '(?P<index>\d\d)-PedalOff(?P<dynamic>[A-Za-z]+)1Close\.flac'
note = { group = "index", style = "index", offset = 20 }
layers = ["Pianissimo", "MezzoPiano", "Forte"]
dynamic_names = { Pianissimo = "pp", MezzoPiano = "mp", Forte = "f" }
order = "note"

# the felt's core (design 2026-10-20-felt-core): a stiff layer under the felt's soft one, its force
# f05 (N) at 0.5 mm past depth_mm, linear between the keys, none from C4. The recording's bass
# brightens from mf to ff by 35–37 dB at 4–6 kHz, the engine's by 13–16 (ff 10–15 dB short there,
# mf right). The depth lies 0.2 mm past each key's compression at mf (measured by sweeping the
# depth: 1.4 mm at A0 to 0.6 at C3; at ff 2.0 to 1.2), so mf is untouched and the core grows in
# toward ff. Chosen by ear (2026-10-21) between 2 and 4 N, on repeated loud notes: 4 N closes
# 4–6 kHz further but lifts 2–4 kHz, already about right, by up to 5 dB
[felt_core]
notes = [21, 26, 36, 45, 47, 60]
f05 = [2.0, 2.0, 2.0, 2.0, 2.0, 0.0]
depth_mm = [1.6, 1.3, 1.1, 0.9, 0.89, 0.8]

# the export voices the piano to one level curve, as a voicer leaves it (design log step 138): each
# key's ff level corrected to a smooth trend through the keys' levels; the board's character stays
# in each key's tone. Heard as "a lot cleaner … mint condition" (2026-10-21); the Condition's
# Normal zone adds the unevenness back at runtime (the voicing's level scatter, step 139)
[even_levels]
window_keys = 9

# the felt set from the recording at the played mf/ff velocities (2026-10-22; the fits never see it):
# too bright at both (mf +5.4/+2.3 dB, ff +7.8/+5.5 at 1–2/2–4 kHz re 200–500 Hz); solved exponent
# 1.88 and −1.3 dB, then by ear 3 dB softer ("better"; the core stays as set)
# then solved again with the pp layer in (2026-10-22): solved from mf and ff alone, the lower
# exponent made soft playing 14 dB too bright at 2–4 kHz re the recording (keys C2–C5), heard as a
# "string-like", plucked noise in soft passages; with pp, mf and ff the pair below ("fixed it")
[felt]
p = 2.32
stiffness_db = -5.7

# the unison set by ear (2026-10-22; the fits never see it): the plugin's Unison width at 75 %
# the unison toward the top key (2026-10-27, unison_check.py; the fits never see it): the fitted
# detune is measured from beats below the top octaves and held above them; the recording's beats
# (partials 1–3) grow to 5.2 cents at keys 102–107, the engine's stayed at 1.9; their ratio from
# key 78 up, a line in log: ×3.12 at 108; measured again on that export (three strings beat at
# their neighbors' gaps, half the spread): ×3.50 (design log step 183)
[unison]
width = 0.75
treble = [[78, 1.0], [108, 10.92]]

# the board's tone by ear (2026-10-22; the fits never see it): within a note, re the band of its
# fundamental, the treble's upper partials sat +3.8/+0.4 dB (mf/ff, 4 kHz) over the recording; trimmed
# from C5 up (keys: from 0 to full) to +1.8/0.0 dB, the middle left alone; not heard (kept: nearer the
# recording)
[board]
trim_db = [[4000.0, -2.5, 60.0, 72.0]]
# the board's low modes ring longer (2026-10-27, by ear on Grands A and B; the fits never see it):
# at loss factor 4 % where that rings longer than the fitted overlap, below 450 Hz; the board's own
# response 0.45–0.6 s below 200 Hz (was ~0.15 s), a grand's board glued into its rim ~0.5 s (Plath)
# (design log step 184)
low_eta = 0.04

# the recordings' credit and terms (proto/license.py writes instruments/<project>/LICENSE.md)
[license]
set = "Piano in 162"
author = "Ivy Audio"
url = "https://www.ivyaudio.com"
terms = "\"free for personal or commercial use\" (the download carries no license text of its own)."
source_license = "free-use"
