# Harp A: VCSL's Concert Harp (CC0), 23 strings E1–F7 in thirds, f and mf (not in an SFZ)
[project]
family = "fingered"
body = "harp"

[menu]
name = "Harp A"
group = "Harps"

[strings]
design = "pedal_harp"
# fingered: plucked by fingers (or picks), no dampers (a hand), a body of its own (engine mic::Body)
traits = ["fingered"]
board_seed = 15
detune = 1.0
# the coupling fit's early-excess term (dB, same weight): the harp's fundamentals from D4 up start
# 9–24 dB above their aftersound's line and fall at 40–110 dB/s for 0.2 s (one polarization coupled
# strongly to the soundboard, the other ringing on); the EDCs start 50 ms in, where the seconds of
# aftersound outweigh it (C5: EDC −4 dB at 0.2 s where the envelope fell 20), and the fit had both
# polarizations decay at the slow rate
w_early = 1.0
# partial decays per note the loss fit needs (8 by default): the harp's treble has 1–3 partials per layer
min_loss_rows = 3
# the harp (thirds, 6 notes below D3): its low edge at 146 Hz and H at −27 dB below it with the default
edge_rows_low = 8
# the harp is plucked near the middle of the string; on the full grid C3 and F4 took the comb's
# ambiguous fractions (0.14, 0.24 for ~0.47) and pulled the curve to 0.12 around B2
beta_range = [0.3, 0.5]

[uses]
dampers = "grand_e"
release = "grand_a"

[export]
# the harp's ff peaks span 24 dB (bass −29, middle −5…−8 dBFS at the common calibration; its
# recordings span as much): the median over the keys lands on the lower middle, and the middle
# register's chords reached +0.2 dBFS in the demo (the others −6…−7); −6 dB puts it with them
# the level by loudness (2026-10-27, design log step 173): a phrase in its middle (an arpeggio at
# velocity 80, chords at 95) lay +5.2 dB re the grands' median (-28.9 LUFS, EBU R128); the
# calibration sets the median key's ff peak, and held tones sound louder than struck ones at one peak
# the level re-matched (2026-10-27, design log step 177): the plugin starts at Player with all keys
# spread; the phrase's midpoint of Recording and Player lay +1.7 dB re the grands' (step 173's phrase)
output_gain_db = -12.5

[[part]]
id = "harp"

[[part.source]]
id = "harp"
role = "main"
root = "vcsl"
# the harp's two layers, as the uprights' two: mf and ff
dynamics = { mf = "mf", ff = "f" }
levels = "recorded"

[part.source.map]
kind = "pattern"
glob = "Chordophones/Composite Chordophones/Concert Harp/KSHarp_*.wav"
regex = 'KSHarp_(?P<note>[A-G]#?\d)_(?P<dynamic>[a-z]+)(?P<take>\d+)\.wav'
note = { group = "note" }
# f and mf: E1 has f only; G1's other take is mp, D7's and F7's p (20–30 dB below f: no mf)
layers = ["mf", "f"]
prefer = ["take"]
order = "note"

# the recordings' credit and terms (proto/license.py writes instruments/<project>/LICENSE.md)
[license]
set = "VCSL: Concert Harp"
author = "Versilian Studios"
url = "https://github.com/sgossner/VCSL"
terms = "The Versilian Community Sample Library."
source_license = "CC0"
