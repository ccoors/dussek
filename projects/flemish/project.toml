# Harpsichord B: VCSL's Flemish, an 8′ and a 4′ register; the export derives the second 8′
# (the 8′ I plucked one jack row nearer the nut, detuned by up to ±1.5 cents) and the lute
# (the 8′ II strings plucked 2.5 cm from the nut) from the 8′ (no recordings; tuned by ear)
[project]
family = "plucked"
body = "harpsichord"

[menu]
name = "Harpsichord B"
group = "Harpsichords"
# the strip draws dark naturals and light sharps, as many harpsichords have them
reversed_keys = true

[strings]
design = "harpsichord_8"
board_seed = 7
detune = 1.0
# the Flemish registers (whole tones): the low edge 8′ 165 → 92 Hz, 4′ 369 → 203 Hz
edge_rows_low = 8
# one recorded layer: the knock's q is not identifiable; the harpsichord's knock gains ~10 dB
# per dynamic step (Penttinen 2006), a step being a doubling of the pluck "speed"
fixed_q = [1.660964047443681]

[uses]
dampers = "grand_e"
buff = "harpsichord_buff"

[export]
# the level by loudness (2026-10-27, design log step 173): a phrase in its middle (an arpeggio at
# velocity 80, chords at 95) lay +8.4 dB re the grands' median (-28.9 LUFS, EBU R128); the
# calibration sets the median key's ff peak, and held tones sound louder than struck ones at one peak
output_gain_db = -8.5
main = "flemish8"
registers = [{ part = "flemish4", octave = 12 }]
choir = true

[release_noise]
# heard too loud (the user, 2026-10-27): its release samples (their partials out, design log step 182)
# put the noise's peak at -24.4 dB re the note's (velocity 80 at Player, the median over C3–F5), the
# grands' at −40 … −44; -14.0 dB puts it at −38, a harpsichord's action a little more present
level_db = -14.0

[[part]]
id = "flemish8"

[[part.source]]
id = "flemish8"
role = "main"
root = "vcsl-keys"
# one layer, played normally: the reference (mf)
dynamics = { mf = "1/1" }
levels = "recorded"
octave = 0
# its own release samples: the release regions of its SFZ (release_noise.py)
release = { kind = "sfz", file = "Harpsichord, Flemish - 8'.sfz" }

[part.source.map]
kind = "sfz"
files = ["Harpsichord, Flemish - 8'.sfz"]
filter = [{ opcode = "trigger", default = "attack", in = ["attack"] }, { opcode = "seq_position", default = "1", in = ["1"] }]
folders = ["Sustains", "NoSus"]
prefer_substring = "/NoSus/"
layers = "rank"

[[part]]
id = "flemish4"
strings = { design = "harpsichord_4" }

[[part.source]]
id = "flemish4"
role = "main"
root = "vcsl-keys"
dynamics = { mf = "1/1" }
levels = "recorded"
# the 4′ register: each sample sounds an octave above its key (the file names give the sounding
# pitch); the analysis works at the sounding note, `key` keeps the key played
octave = 12
release = { kind = "sfz", file = "Harpsichord, Flemish - 4'.sfz" }

[part.source.map]
kind = "sfz"
files = ["Harpsichord, Flemish - 4'.sfz"]
filter = [{ opcode = "trigger", default = "attack", in = ["attack"] }, { opcode = "seq_position", default = "1", in = ["1"] }]
folders = ["Sustains", "NoSus"]
prefer_substring = "/NoSus/"
layers = "rank"

# the recordings' credit and terms (proto/license.py writes instruments/<project>/LICENSE.md)
[license]
set = "VCSL Keys: Harpsichord \"Flemish\""
author = "Versilian Studios"
url = "https://github.com/sgossner/VCSL"
terms = "The Versilian Community Sample Library."
source_license = "CC0"
