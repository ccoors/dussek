# Iowa MIS tenor trombone (anechoic, a complete set)
[project]
# recorded anechoic (Iowa MIS), as the Compare page renders it
recorded_dry = true
family = "brass"

[uses]
# the mutes' shapes and their correction, scaled with the bell
mutes = "trumpet"

[menu]
name = "Tenor Trombone"
group = "Brass"
experimental = true

# Weidinger has these two texts built in since step 248: drop both labels at the next rebuild
[menu.labels.variation]
name = "Player's variation"
description = "How much each note differs from the last in the virtual player's hands: its air, vibrato and intonation. 100 % as it was fitted, 0 every note alike. From the next note."

[menu.labels.dynamics]
name = "Dynamics"
description = "How the velocity maps to the air: less brings the soft notes up, with more air, so also brighter; more takes them down. 45 dB plays the velocity as it comes."

[pose]
# the bell as played: forward and a little down, the bell 65 cm in front of the ears, left of them
# and a little under; azimuth clockwise from the player's front and elevation up, degrees; the ears
# from the bell's mouth (right, front, up), m (the microphones' Player, the Audience at their
# height)
azimuth = 0
elevation = -14
ears = [0.15, -0.65, 0.05]

[brass]
# the attack (step 244): the pressure rises over ten periods of the note under 100 Hz, back to 8 ms an octave above (a
# low note rising in 8 ms shocks the bore into ringing louder than it then holds); never under the note's pressure
attack_rise_periods = 10
attack_rise_hz = 100
attack_lean = false
# the rise starts from a fifth of the pressure: from none the lips waited 50-60 ms for their first sound at the
# bottom (step 247)
attack_rise_from = 0.2
# a tongued note on a release still sounding (the strip's glissando) fades the release out and starts from rest
# (step 247)
attack_from_rest = true
# a tenor trombone, 13.9 mm bore, 8.5 inch bell; the slide stands where the valves do. Round numbers
# from the literature, not measurements of the recorded one
# (length, radius in, radius out), m: cup, throat, backbore, leadpipe
mouth = [[0.008, 0.0125, 0.0125], [0.007, 0.0032, 0.0032], [0.08, 0.0032, 0.005], [0.23, 0.005, 0.00695]]
cyl = [1.3216, 0.00695]
# the lengths and flare by proto/brass/fit_bore.py
bell = [1.1434, 0.108, 0.7881]
sides = [[127, 58.27, 2.8, 0.0]]
width = 0.016
mu = 1.5
y0 = 0.00015
nl = 3.0
fmin = 25.0
center = 55
top_from = 127
low = 40
high = 72
stem = "TenorTrombone"
hp = 30.0
# a slur can glide
slide = true
mutes = ["straight", "cup", "wah", "wah_stem", "bucket", "plunger"]
plunger = true
# by ear on their first fits; below about 200 Hz the floor between harmonics is mostly the harmonics'
# own skirts, so the measure would ask for far more
noise = [-3, -3, -8, -15, -16]
# the harmonics' correction may lift this far (dB): at +10 the ff stayed darker than its recording
ff_cap = 20.0
mf_cap = 20.0
# a mute as wide as the bell: past its first mode across the chamber holds no waves along its length
plain_chamber = true
gain_db = 11.0

# the attack's slack lips, at most this share of the way to the next mode down
scoop_span = 0.25
# velocity to air: at these velocities (first row), this air (second)
vel_air = [[1, 30, 64, 105, 127], [30, 48, 72, 112, 127]]

[[part]]
id = "tenor_trombone"

# Iowa's runs cut into notes by analysis/split_brass.py
[[part.source]]
id = "tenor_trombone_iowa"
role = "main"
root = "iowa-mis-brass"
dynamics = { pp = "pp", mf = "mf", ff = "ff" }
levels = "recorded"

[part.source.map]
kind = "pattern"
glob = "notes/TenorTrombone/*/*.wav"
match = "relpath"
regex = 'notes/TenorTrombone/(?P<dynamic>pp|mf|ff)/(?P<midi>\d+)\.wav'
note = { group = "midi", style = "midi" }
layers = ["pp", "mf", "ff"]
order = "layer"

[export]
# at the grands' loudness: step 173's phrase (an arpeggio at 80, four long notes at 95) at Audience
# measured −25.2 LUFS against the grands' median −30.4 (step 243; −23.4 before the attack's settings, step 244)
output_gain_db = -5.2

[license]
set = "University of Iowa Musical Instrument Samples: Tenor Trombone"
author = "University of Iowa Electronic Music Studios"
url = "https://theremin.music.uiowa.edu/MIS.html"
terms = "\"Since 1997, these recordings have been freely available on this website and may be downloaded and used for any projects, without restrictions.\""
source_license = "free-use"
