# VCSL's plucked psaltery (the bowed psaltery's strings plucked): 11 notes A♯4–F♯6 a whole tone
# apart (named an octave low), one take each at one dynamic
[project]
family = "fingered"
body = "psaltery"

[menu]
name = "Psaltery"
group = "Zithers"

[strings]
design = "plucked_psaltery"
# fingered: plucked by fingers (or picks), no dampers (a hand), a body of its own (engine mic::Body)
# picked: plucked with a pick or a nail (the đàn tranh's finger picks): the quill's lowpass
traits = ["fingered", "picked"]
board_seed = 19
detune = 1.0
min_loss_rows = 3
edge_rows_low = 3
# its strings ring between the partials ("rooms" of 5–20 s): VCSL's dry studio, as its harp
# measures it (0.2–0.5 s)
room_t60 = "vcsl_dry"

[uses]
dampers = "grand_e"
release = "grand_a"

# the level by loudness (2026-10-27, design log step 173): a phrase in its middle (an arpeggio at
# velocity 80, chords at 95) lay +5.9 dB re the grands' median (-28.9 LUFS, EBU R128); the
# calibration sets the median key's ff peak, and held tones sound louder than struck ones at one peak
[export]
output_gain_db = -6.0

[[part]]
id = "psaltery"

[[part.source]]
id = "psaltery"
role = "main"
root = "vcsl"
# one layer, played normally: the reference (mf)
dynamics = { mf = "1/1" }
levels = "recorded"

[part.source.map]
kind = "pattern"
glob = "Chordophones/Zithers/Psaltery, Bowed and Plucked/Pluck/BowedPsaltery_*_Pluck_*.wav"
regex = 'BowedPsaltery_(?P<note>[A-G]#?\d)_Main_Pluck_rr\d+\.wav'
note = { group = "note", shift = 12 }
dynamic = "1/1"
order = "path"

# the recordings' credit and terms (proto/license.py writes instruments/<project>/LICENSE.md)
[license]
set = "VCSL: Psaltery"
author = "Versilian Studios"
url = "https://github.com/sgossner/VCSL"
terms = "The Versilian Community Sample Library."
source_license = "CC0"
