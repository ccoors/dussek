[project]
family = "struck"
skip = ["release_noise", "dampers", "pedal_noise"]
body = "upright"

[menu]
name = "Upright A"
group = "Upright pianos"

[strings]
design = "upright"
board_seed = 3
detune = 1.0
id_max_partial = 60
# the room: the decay between its recordings' partials reads 1.2–1.6 s at 126–252 Hz (its hum and
# strings ringing in the gaps, not the room); VCSL's dry studio instead, heard best (2026-10-24)
room_t60 = "vcsl_dry"

[uses]
# Grand E's dampers, heard best (2026-10-24): Upright A's release recordings hold their level for
# 0.2 s before they fall (a late landing or takes begun before the key's release), read as 16–38 dB/s
# against Grand E's 90–240; Upright Y's own (Releases) are cut at 0.3 s, their fall unreadable
dampers = "grand_e"
release = "grand_a"
pedal = "grand_a"

# the export voices the piano to one level curve, as a voicer leaves it (design log step 138), as the
# grands (step 139): each key's ff level corrected to a smooth trend through the keys' levels (rms
# 1.7 dB off it before); the Condition's Normal zone adds the unevenness back at runtime
[even_levels]
window_keys = 9

# the board's tone by ear (2026-10-26; the fits never see it): within a note, re the band of its
# fundamental (the first second, the layers' velocities), the treble's 4 kHz sat +18.0/+8.7 dB (mf/ff)
# over the recordings, more than the grands' before step 143; trimmed from C4 to C5 (keys: from 0 to
# full) to +11.9/+1.1, 8 kHz to −4.3/+5.9. Heard as "less glassy … definitely an improvement". The
# rest of mf's excess changes with the dynamic: the felt's (step 146), not the board's
[board]
trim_db = [[4000.0, -10.0, 60.0, 72.0], [8000.0, -5.0, 60.0, 72.0]]
# the board's low modes ring longer (2026-10-27, by ear on Grands A and B; the fits never see it):
# at loss factor 4 % where that rings longer than the fitted overlap, below 450 Hz; the board's own
# response 0.45–0.6 s below 200 Hz (was ~0.15 s), a grand's board glued into its rim ~0.5 s (Plath)
# (design log step 184)
low_eta = 0.04

# the felt by ear (2026-10-24; the fits never see it): the fitted felt (p 2.30) left the attack at mf
# 5–14 dB dark re the recording at 1–4 kHz (re 200–500 Hz, keys C2–C5, the export's velocities);
# solved against mf and ff from two probes (step 141's method): p 1.92, +6.2 dB, within about ±4 dB;
# then +3 dB by ear ("a little brighter still")
[felt]
p = 1.92
stiffness_db = 9.2

# the ring by ear (2026-10-24; the fits never see it): as Upright B's (step 154), the grands ringing
# longer than their recordings (Grand A's late level 4–7 dB over in the middle); heard as better:
# 150 % to C5, 200 % at C7
[sustain]
percent = [[72, 150.0], [96, 200.0]]

# the level by loudness (2026-10-27, design log step 173): a phrase in its middle (an arpeggio at
# velocity 80, chords at 95) lay +2.0 dB re the grands' median (-28.9 LUFS, EBU R128); the
# calibration sets the median key's ff peak, and held tones sound louder than struck ones at one peak
[export]
output_gain_db = -2.0

[[part]]
id = "upright_a"

[[part.source]]
id = "upright_a"
role = "main"
root = "vcsl-keys"
# two layers, taken as mf and ff
dynamics = { mf = "1/2", ff = "2/2" }
levels = "recorded"
# its release recordings (the release regions) are not read: Grand E's dampers in [uses]

[part.source.map]
kind = "sfz"
files = ["Upright Piano, Knight.sfz"]
filter = [{ opcode = "trigger", default = "attack", in = ["attack"] }, { opcode = "seq_position", default = "1", in = ["1"] }]
folders = ["Sustains", "NoSus"]
prefer_substring = "/NoSus/"
layers = "rank"

# the unison toward the top key (2026-10-27, unison_check.py; the fits never see it): the fitted
# detune is measured from beats below the top octaves and held above them; the recording's beats
# (partials 1–3) grow to 8.4 cents at keys 102–107, the engine's stayed at 1.2; their ratio from
# key 78 up, a line in log: ×9.48 at 108; measured again on that export (three strings beat at
# their neighbors' gaps, half the spread): ×2.42, held at 12 (design log step 183)
[unison]
treble = [[78, 1.0], [108, 12.00]]

# the recordings' credit and terms (proto/license.py writes instruments/<project>/LICENSE.md)
[license]
set = "VCSL Keys: Upright \"Knight\""
author = "Versilian Studios"
url = "https://github.com/sgossner/VCSL"
terms = "The Versilian Community Sample Library."
source_license = "CC0"
