# Iowa MIS percussion (anechoic, 2013): octave runs split per note by analysis/split_runs.py
# the bells (a glockenspiel, no dampers): plastic mallets at pp, mf and ff, brass at one dynamic (split_runs.py takes it as mf)
[project]
# recorded anechoic (Iowa MIS): the Compare page renders it without a room, as it was recorded
recorded_dry = true
family = "bars"
body = "bells"

[menu]
name = "Bells"
group = "Percussion"
# the mallets' names as the menu shows them (the file's are the fits' ids)
mallets = ["Plastic", "Brass"]

# the bells (a glockenspiel: steel bars, no resonators, no dampers): the fundamental, a mode
# from 3.3 (C5) to 2.85 (C7 up), the strongest from 7.2 to 5.4 (to G♯7: −3 to −17 dB re the
# fundamental, gone within 0.1 s), one from 12.0 to 9.5 (to D6), a torsional one (its ratio
# ∝ f1^−½, a shorter bar: 11.3 at C5, 4.0 at C8), one from 16.4 to 12.4 (to A6; above,
# over 20 kHz) and two quiet ones (4.9 to 3.35, as slow as the fundamental; 4.1 to 3.2).
# The brass mallets at one dynamic: their spacing and the cutoff's opening the plastic's
[bars]
tracks = [1.0, [[72, 3.29], [84, 3.12], [96, 2.9], [112, 2.9]], [[72, 7.21], [76, 6.85], [81, 6.42], [86, 6.07], [91, 5.81], [93, 5.64], [96, 5.61]], [[72, 11.96], [74, 11.48], [76, 11.0], [78, 10.76], [80, 10.3], [82, 9.9], [84, 9.71], [86, 9.5]], [[72, 11.3], [76, 10.18], [80, 9.13], [84, 8.05], [86, 7.53], [89, 6.93], [93, 5.95], [96, 5.42], [98, 5.07], [101, 4.71], [103, 4.43], [105, 4.18], [108, 3.96]], [[72, 16.39], [77, 14.89], [80, 14.73], [84, 14.03], [88, 13.4], [90, 13.29], [93, 12.37]], [[72, 4.85], [74, 4.61], [76, 4.4], [78, 4.29], [80, 4.08], [82, 3.91], [84, 3.81], [86, 3.71], [88, 3.62], [90, 3.59], [91, 3.48], [93, 3.35]], [[74, 4.11], [76, 3.98], [78, 3.8], [80, 3.68], [81, 3.62], [83, 3.49], [84, 3.39], [85, 3.32], [86, 3.24]]]
tol = [0.03, 0.04, 0.03, 0.025, 0.03, 0.03, 0.025, 0.025]
scale_cutoff = true
fast_decays = true
tied = { 1 = 0 }

# the bells ring 5–14 s without dampers: a piece's notes pile up (the demo folded into their 3
# octaves peaked at +4.6 dBFS, 8 dB over the marimba's), so 8 dB under the calibration
[export]
motor = false
# the level by loudness (2026-10-27, design log step 173): a phrase in its middle (an arpeggio at
# velocity 80, chords at 95) lay -1.2 dB re the grands' median (-28.9 LUFS, EBU R128); the
# calibration sets the median key's ff peak, and held tones sound louder than struck ones at one peak
gain_db = -7.0

[[part]]
id = "bells"

[[part.source]]
id = "bells_plastic"
role = "mallet"
mallet = "plastic"
root = "iowa-mis-percussion"
dynamics = { pp = "pp", mf = "mf", ff = "ff" }
levels = "normalized"
# the Iowa runs: true levels within each octave run, each run at its own gain or touch (the
# marimba's yarn pp C6–B6 9 dB over the runs around it): level corrections within a run only
level_groups = "octave"

[part.source.map]
kind = "pattern"
glob = "notes/bells.plastic/*/*.wav"
match = "relpath"
regex = 'notes/bells\.plastic/(?P<dynamic>pp|mf|ff)/(?P<midi>\d+)\.wav'
note = { group = "midi", style = "midi" }
layers = ["pp", "mf", "ff"]
order = "layer"

# by hand (2026-10-16): the pp 1.6 dB up throughout, the Compare page's pp re mf against the
# recordings in each run (−1.0, −1.1, −2.3 dB). The keys scatter ±3–4 dB within their runs (struck
# unevenly) and one key alone swayed the page's proposal by 7.4 dB: no curve along the keys
[part.source.level_corrections]
keys = [72, 108]
pp = [1.6, 1.6]

[[part.source]]
id = "bells_brass"
role = "mallet"
mallet = "brass"
root = "iowa-mis-percussion"
dynamics = { mf = "mf" }
levels = "normalized"
# the Iowa runs: true levels within each octave run, each run at its own gain or touch (the
# marimba's yarn pp C6–B6 9 dB over the runs around it): level corrections within a run only
level_groups = "octave"

[part.source.map]
kind = "pattern"
glob = "notes/bells.brass/*/*.wav"
match = "relpath"
regex = 'notes/bells\.brass/(?P<dynamic>pp|mf|ff)/(?P<midi>\d+)\.wav'
note = { group = "midi", style = "midi" }
layers = ["pp", "mf", "ff"]
order = "layer"

# the recordings' credit and terms (proto/license.py writes instruments/<project>/LICENSE.md)
[license]
set = "University of Iowa Musical Instrument Samples: Bells"
author = "University of Iowa Electronic Music Studios"
url = "https://theremin.music.uiowa.edu/MISbells.html"
terms = "\"Since 1997, these recordings have been freely available on this website and may be downloaded and used for any projects, without restrictions.\" (https://theremin.music.uiowa.edu/MIS.html)"
source_license = "free-use"
