# Grand E: VCSL's 1895 grand "S Model B" (pedal up; 3 layers vl2–vl4, normalized: no level target)
[project]
family = "struck"
# register: its balance along the keys fitted against Grand B's recordings ([uses] levels; skipped
# from the project files' start until 2026-10-16: its treble rendered 9–13 dB over Grand B's)
skip = ["release_noise", "pedal_noise"]
body = "grand"

[menu]
name = "Grand E"
group = "Grand pianos"

[strings]
design = "grand"
board_seed = 8
detune = 1.0
id_max_partial = 60

[uses]
release = "grand_a"
pedal = "grand_a"
# Grand B's set (Iowa), the same model with every note at real levels (Grand E's model alone
# put its bass 16–26 dB too low re the treble)
levels = "grand_b"

[export]
# the level re-matched (2026-10-27, design log step 177): the plugin starts at Player with all keys
# spread; the phrase's midpoint of Recording and Player lay +1.6 dB re the grands' (step 173's phrase)
output_gain_db = -1.5

[[part]]
id = "grand_e"

[[part.source]]
id = "grand_e"
role = "main"
root = "vcsl-keys"
# vl2 0–65, vl3 66–99, vl4 100–127 (the set has no vl1)
dynamics = { pp = "v2", mf = "v3", ff = "v4" }
# normalized: the register balance follows another set's recorded levels instead ([uses]
# levels), and the felt fit takes that set's hammer speeds
levels = "normalized"
# its release recordings (close microphones): the dampers the other grands borrow too
dampers = { kind = "sfz", file = "Grand Piano, S Model B 1895.sfz" }

[part.source.map]
kind = "sfz"
files = ["Grand Piano, S Model B 1895.sfz"]
filter = [{ opcode = "trigger", default = "attack", in = ["attack"] }, { opcode = "seq_position", default = "1", in = ["1"] }]
folders = ["Sustains", "NoSus"]
prefer_substring = "/NoSus/"
layers = "rank"
dynamic_from = { regex = '_vl?(\d+)_', format = "v{}" }

# the export voices the piano to one level curve, as a voicer leaves it (design log step 138): each
# key's ff level corrected to a smooth trend through the keys' levels; the board's character stays
# in each key's tone. Heard as "a lot cleaner … mint condition" (2026-10-21); the Condition's
# Normal zone adds the unevenness back at runtime (the voicing's level scatter, step 139)
[even_levels]
window_keys = 9

# the felt set from the recording at the played mf/ff velocities (2026-10-22; the fits never see it):
# it opened far too much from mf to ff (+3.8/+10.2 dB at 1–2/2–4 kHz re its recording, mf −3.7/−7.0);
# solved for exponent and stiffness (mf −2.5/−0.2, ff +0.8/+2.1 after), heard as fine
# then solved again with the pp layer in (2026-10-22): solved from mf and ff alone, the lower
# exponent made soft playing 10.7 dB too bright at 2–4 kHz re the recording (keys C2–C5), heard as a
# "string-like", plucked noise in soft passages; with pp, mf and ff the pair below ("fixed it")
[felt]
p = 1.9
stiffness_db = 2.2

# the board's tone by ear (2026-10-22; the fits never see it): within a note, re the band of its
# fundamental, the treble's upper partials sat +4.1/+5.1 dB (mf/ff, 4 kHz) over the recording; trimmed
# from C5 up (keys: from 0 to full) to +1.6/+2.0 dB, the middle left alone; heard as an improvement.
# The lowest octave (2026-10-23): its board fit's data start at 58 Hz, below which the board's
# response is held flat; the fundamentals of A0–G♯1 sat 11 dB over partials 2–4 against the
# recording (29–37 Hz up to 21 dB); 31.5 Hz −12 and 45 Hz −2 dB (least squares over the keys) bring
# them to 0 dB, heard as "a very clear difference … more realistic"
[board]
trim_db = [[4000.0, -4.5, 60.0, 72.0], [31.5, -12.0], [45.0, -2.0]]
# the board's low modes ring longer (2026-10-27, by ear on Grands A and B; the fits never see it):
# at loss factor 4 % where that rings longer than the fitted overlap, below 450 Hz; the board's own
# response 0.45–0.6 s below 200 Hz (was ~0.15 s), a grand's board glued into its rim ~0.5 s (Plath)
# (design log step 184)
low_eta = 0.04

# the unison toward the top key (2026-10-27, unison_check.py; the fits never see it): the fitted
# detune is measured from beats below the top octaves and held above them; the recording's beats
# (partials 1–3) grow to 4.3 cents at keys 96–101, the engine's stayed at 2.8; their ratio from
# key 78 up, a line in log: ×3.28 at 108; measured again on that export (three strings beat at
# their neighbors' gaps, half the spread): ×3.53 (design log step 183)
[unison]
treble = [[78, 1.0], [108, 11.58]]

# the recordings' credit and terms (proto/license.py writes instruments/<project>/LICENSE.md)
[license]
set = "VCSL Keys: Grand \"S Model B 1895\""
author = "Versilian Studios"
url = "https://github.com/sgossner/VCSL"
terms = "The Versilian Community Sample Library."
source_license = "CC0"
