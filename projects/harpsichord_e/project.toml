# Harpsichord E: Edinburgh's double-manual French harpsichord by Luigi Baillon, 1755 (St Cecilia's
# Hall, CC BY 4.0), F1–F6 at A = 415 Hz in an unequal temperament, one take per key; the lower
# manual's 8′ (the upper manual's 8′ recorded too). Noise reduction applied by the set's authors
# ("not an accurate record of the decay", its readme): its floors lie at −55 … −74 dBFS
[project]
family = "plucked"
body = "harpsichord"
# no release samples: Harpsichord A's release noise
skip = ["release_noise"]

[menu]
name = "Harpsichord E"
group = "Harpsichords"
# the strip draws dark naturals and light sharps, as many harpsichords have them
reversed_keys = true

[strings]
design = "harpsichord_8"
board_seed = 22
detune = 1.0
# one recorded layer: the knock's q is not identifiable; the harpsichord's knock gains ~10 dB
# per dynamic step (Penttinen 2006), a step being a doubling of the pluck "speed"
fixed_q = [1.660964047443681]
# the noise-reduced decay between the partials is no room: an assumed room, (band Hz, T60 s): St
# Cecilia's Hall's museum gallery, as the clavichord's
room_t60 = [[250.0, 1.2], [1000.0, 1.0], [4000.0, 0.7], [16000.0, 0.4]]

[uses]
dampers = "grand_e"
buff = "harpsichord_buff"
release = "harpsichord"

# the level by loudness (design log step 173's measure): a phrase in its middle (an arpeggio at
# velocity 80, chords at 95) lay +8.2 dB re the grands' median (-28.9 LUFS, EBU R128); the
# calibration sets the median key's ff peak, and held tones sound louder than struck ones at one peak
[export]
output_gain_db = -8.0
main = "harpsichord_e_lower"
# the second 8′ choir, measured (harpsichord_e_upper): on the 8′ II's stop, no 4′
registers = [{ part = "harpsichord_e_upper", octave = 0, name = "8′ II", stop = 2 }]

[[part]]
id = "harpsichord_e_lower"

[[part.source]]
id = "harpsichord_e_lower"
role = "main"
root = "edinburgh-baillon"
# one take per key, played normally: the reference (mf)
dynamics = { mf = "1/1" }
levels = "recorded"
# at its own A (`a4`, analyze.analyze)
extra = { a4 = 415.0 }

[part.source.map]
kind = "pattern"
glob = "raw/Harpsichord_Double_Manual_Luigi-Baillon-1755/Lower_Manual/*.wav"
regex = '(?P<note>[A-G]s?\d)_\d+_Harpsichord-LowerManual-.*\.wav'
note = { group = "note" }
dynamic = "1/1"
order = "path"

# the upper manual's 8′: the second register, on the 8′ II's stop
[[part]]
id = "harpsichord_e_upper"

[[part.source]]
id = "harpsichord_e_upper"
role = "main"
root = "edinburgh-baillon"
# one take per key, played normally: the reference (mf)
dynamics = { mf = "1/1" }
levels = "recorded"
# at its own A (`a4`, analyze.analyze)
extra = { a4 = 415.0 }

[part.source.map]
kind = "pattern"
glob = "raw/Harpsichord_Double_Manual_Luigi-Baillon-1755/Upper_Manual/*.wav"
regex = '(?P<note>[A-G]s?\d)_\d+_Harpsichord-UpperManual_.*\.wav'
note = { group = "note" }
dynamic = "1/1"
order = "path"

# the recordings' credit and terms (proto/license.py writes instruments/<project>/LICENSE.md)
[license]
set = "Double-Manual Harpsichord, Luigi Baillon, 1755"
author = "University of Edinburgh"
url = "https://doi.org/10.7488/ds/8091"
terms = "Edinburgh DataShare."
source_license = "CC-BY-4.0"
