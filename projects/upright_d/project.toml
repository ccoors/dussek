# upright_d: made from upright_a's project file (the closest key range, the usual one; its by-ear values measured again on this set where noted)
[project]
family = "struck"
body = "upright"

[menu]
name = "Upright D"
group = "Upright pianos"

[strings]
design = "upright"
# a board of its own (the other uprights 3, 5, 9)
board_seed = 7
detune = 1.0
id_max_partial = 60
# the room: its own, measured between the recordings' partials (body_decay, the median over the keys):
# 0.65 s at 250 Hz, 0.29–0.36 s from 800 Hz to 8 kHz, a living room's; below 250 Hz the gaps read
# 2.9–5.6 s (strings ringing in them, not the room: Upright A's 1.2–1.6 s were its hum), held at 250 Hz
room_t60 = [[250.0, 0.65], [500.0, 0.34], [800.0, 0.26], [2000.0, 0.35], [4000.0, 0.36], [8000.0, 0.30], [12800.0, 0.26]]

# the pedal's thumps at its recordings' level (2026-10-31): played 3.6–4.8 dB over them re the mf
# notes (the exported reference, the model's radiated mf peak, lies over the engine's played one), and
# heard as too loud; the ring's target stays the recordings'
[noises]
pedal_level_db = -4.5

# the release noise at its recordings' level re the notes (2026-11-01): played 1–7 dB over it (median
# 4.5; velocities 64 and 110 against mf and ff, keys C1–C6), the export's reference over the engine's
# played peak as for the pedal's thumps
[release_noise]
level_db = -4.5

# the export voices the piano to one level curve, as a voicer leaves it (design log step 138), as the
# grands (step 139) and the other uprights (step 168); the Condition's Normal zone adds the unevenness
# back at runtime
[even_levels]
window_keys = 9

# the board's low modes ring longer (2026-10-27, by ear on Grands A and B; the fits never see it):
# at loss factor 4 % where that rings longer than the fitted overlap, below 450 Hz; the board's own
# response 0.45–0.6 s below 200 Hz (was ~0.15 s), a grand's board glued into its rim ~0.5 s (Plath)
# (design log step 184)
# the board's tone (2026-10-31; the fits never see it), measured as steps 147 and 168 (tone_check.py):
# its board fit's data start at 92 Hz, below which its response is held flat, and the fundamentals of
# A0–G♯1 sat +19.1 dB over partials 2–4 against the recordings (C1 +35 … +47); 22.5 and 31.5 Hz −12 dB
# (the bound), 45 Hz −6 (−12 also cut A1–C2 under their recordings): +2.3 dB (C1 still +17 … +28,
# A1–G♯2 −6.0, D♯2 and F♯2 −7 … −16 with or without the rows). The treble (C5 up, within a note re its
# fundamental's band, after the felt below): 2 and 4 kHz +11.8 / +10.1 dB over the recordings at mf
# (ff +14.8 / +10.2), more than the grands' before step 143; trimmed from C4 to C5 (keys: from 0 to
# full) to +5.7 / +3.1 (ff +8.3 / +4.3), within the grands' range. Not heard yet
[board]
trim_db = [[22.5, -12.0], [31.5, -12.0], [45.0, -6.0], [2000.0, -8.0, 60.0, 72.0], [4000.0, -6.0, 60.0, 72.0]]
low_eta = 0.04

# the felt (2026-10-31; the fits never see it): the fitted felt (p 2.30) left the attack at 1–4 kHz re
# 200–500 Hz (keys C2–C5, the export's velocities) 12–17 dB dark at pp, 3–4 at mf, right at ff; solved
# against pp, mf and ff from two probes (step 142's method): p 1.82, +5.3 dB, C2–C5 within ±1.6 dB at
# all three; A0–B2 stays dark at 1–2 kHz (−4 … −8 dB) and at ff 2–4 kHz (−9). Not heard yet
[felt]
p = 1.82
stiffness_db = 5.3

# the strings ringing along by ear (2026-10-31; the fits never see it): the undamped treble (F6 up) rang
# "quite intensely on their own"; the Sympathetic resonance control at about 25 % heard right. Measured
# on the releases pass (keys C3–C5 held 2.3 s and released, the band of the undamped strings'
# fundamentals, 1.4–4.3 kHz, 0.5–2 s after the release re the attack): the recording at its floor
# (−50.2 dB; −50.3 before the strike: no ring above it), the engine −48.3 dB at 100 %, −54.2 at 50 %,
# −60.2 at 25 %
[sympathetic]
percent = 25.0

# the felt's core (2026-10-31): Upright C's, heard by the maintainer to improve this piano in the plugin
# (its Felt tab); 3 N at 0.5 mm past the core's depth to D♯2, none from C3
[felt_core]
notes = [21, 39, 48]
f05 = [3.0, 3.0, 0.0]
depth_mm = [0.8, 0.55, 0.45]

# the ring by ear as the other uprights' (step 154): 150 % to C5, 200 % at C7 (the user heard every
# upright's fitted ring as short; Upright D's not heard yet)
[sustain]
percent = [[72, 150.0], [96, 200.0]]

# the unison toward the top key (2026-10-31, unison_check.py, as step 183; the fits never see it): the
# recording's beats (partials 1–3) 1.2–2.0 cents per half octave from C4 to B7, 10.0 at key 105 (one
# key), the engine's 1.3–4.3; their ratio from key 78 up, a line in log: ×1.81 at 108
[unison]
treble = [[78, 1.0], [108, 1.81]]

[[part]]
id = "upright_d"

[[part.source]]
id = "upright_d"
role = "main"
root = "own-upright"
# the maintainer's own session (docs/recording-a-piano.md), split by analysis/split_session.py: pp, mf
# and ff passes, every third key from A0, two takes each (seq_position 1 the more even), and the keys at
# the breaks (D3, E6, F6) at the dynamic their level is nearest
dynamics = { pp = "pp", mf = "mf", ff = "ff" }
levels = "recorded"
# its releases pass (mf, A0–E6): the dampers
dampers = { kind = "sfz", file = "own-upright.sfz" }
# the release noise: its silent releases (2026-11-01: keys every third released without their note,
# split_session.py --silent), the key's return and the damper landing on still strings; its notes'
# release takes (step 205) held the damped strings' remainder, 20–30 dB over the floor and no
# distinct thump ("way too loud and clicky"), and Grand A's (Salamander's) was borrowed until then
release = { kind = "silent" }
# its pedal pass, split by the strings' ring after each event (split_session.py --pedal): four
# pedal-downs, three pedal-ups (nine events left out: unclear, or the next too soon)
# The engine plays the downs in turn whatever the press: down_3 and down_4 are stomps (−10.1 and −4.6 dB
# re the mf note, their clack at the onset: the highs over 4 kHz −37 / −38 dB re the peak in the first
# 5 ms, down_1 and down_2's −138 / −68), which every third and fourth press played ("sometimes
# clicky", 2026-10-31): the thumps the two normal presses; the ring's target every press (heard right)
pedal = { kind = "files", down = ["pedal/down_1.wav", "pedal/down_2.wav"], up = ["pedal/up_1.wav", "pedal/up_2.wav", "pedal/up_3.wav"], ring = ["pedal/down_1.wav", "pedal/down_2.wav", "pedal/down_3.wav", "pedal/down_4.wav"] }

[part.source.map]
kind = "sfz"
files = ["own-upright.sfz"]
filter = [{ opcode = "trigger", default = "attack", in = ["attack"] }, { opcode = "seq_position", default = "1", in = ["1"] }]
layers = "rank"
dynamic_from = { regex = '_(pp|mf|ff)_', format = "{}" }

# the recordings' credit (proto/license.py writes instruments/<project>/LICENSE.md); CC BY 4.0, the
# maintainer's choice (2026-10-31)
[license]
set = "An upright piano, recorded in a living room (2026-10-31)"
author = "Christian Friedrich Coors"
terms = "The maintainer's own recordings, not published."
source_license = "CC-BY-4.0"
