# Upright C: KeyPleezer's LivingRoom Upright, Micro SFZ (audio CC BY-SA 4.0): p and f
[project]
family = "struck"
skip = ["release_noise", "dampers", "pedal_noise"]
body = "upright"

[menu]
name = "Upright C"
group = "Upright pianos"

[strings]
design = "upright"
board_seed = 9
detune = 1.0
id_max_partial = 60
edge_rows_low = 8
# the room: the decay between its recordings' partials reads 1.1–4.5 s from 250 Hz to 3.2 kHz (a
# living room rings about 0.5 s: strings ringing in the gaps or the take's own reverb), heard as far
# too much reverb; VCSL's dry studio instead, heard best against an assumed living room (2026-10-24)
room_t60 = "vcsl_dry"

[uses]
# Grand E's dampers, heard best (2026-10-24): Upright A's release recordings hold their level for
# 0.2 s before they fall (a late landing or takes begun before the key's release), read as 16–38 dB/s
# against Grand E's 90–240; Upright Y's own (Releases) are cut at 0.3 s, their fall unreadable
dampers = "grand_e"
release = "grand_a"
pedal = "grand_a"

# the export voices the piano to one level curve, as a voicer leaves it (design log step 138), as the
# grands (step 139): each key's ff level corrected to a smooth trend through the keys' levels (rms
# 1.8 dB off it before); the Condition's Normal zone adds the unevenness back at runtime
[even_levels]
window_keys = 9

# the board's lowest octave (2026-10-26; the fits never see it): its board fit's data start at 55 Hz,
# below which the board's response is held flat (step 147); the fundamentals of A0–G♯1 sat 9.9 dB over
# partials 2–4 against the recordings (F1 16 dB); 31.5 Hz −12 dB (least squares over the keys; a 45 Hz
# row would take B1–G♯2, already 6 dB under) brings them to −0.2 dB. Not heard much; kept, nearer the
# recordings
[board]
trim_db = [[31.5, -12.0]]
# the board's low modes ring longer (2026-10-27, by ear on Grands A and B; the fits never see it):
# at loss factor 4 % where that rings longer than the fitted overlap, below 450 Hz; the board's own
# response 0.45–0.6 s below 200 Hz (was ~0.15 s), a grand's board glued into its rim ~0.5 s (Plath)
# (design log step 184)
low_eta = 0.04

# the hammer's thump (step 126) 10 dB down up to C4 and 6 dB from C6 up, linear between: heard too
# intense in playing (the user, 2026-10-19); 10 dB more with the dry room (2026-10-24)
[impact]
trim_db = [[60, -20.0], [84, -16.0]]

# the felt by ear (2026-10-24; the fits never see it): the fitted felt (p 2.30) left the attack at mf
# 4–7 dB dark re the recording at 1–4 kHz (keys C2–C5), its bass 10–15; solved against mf and ff from
# two probes (step 141's method): p 1.92, +4.5 dB, C2–C5 within ±3.3 dB
[felt]
p = 1.92
stiffness_db = 4.5

# the felt's core by ear (2026-10-24; design 2026-10-20-felt-core): with the felt above the bass stayed
# dark (A0–B2, mf 1–2 kHz −8.9 dB, ff 2–4 kHz −9.1); a core at 3 N, its depth at about half the
# rigid-string bound of each key's compression at mf (A0 1.66 mm), so that it reaches mf; none from
# C3: A0–B2 at mf 2–4 kHz +1.5, ff +3.4/+0.5 dB (mf's 1–2 kHz −8.6 in every probe: not the felt's).
# Heard better than a deeper core at 2 N (1.1 → 0.65 mm: ff only)
[felt_core]
notes = [21, 39, 48]
f05 = [3.0, 3.0, 0.0]
depth_mm = [0.8, 0.55, 0.45]

# the ring by ear (2026-10-24; the fits never see it): as Upright B's (step 154), but 150 % over the
# whole keyboard (Upright B's rise to 200 % in the treble heard as too much here)
[sustain]
percent = [[60, 150.0]]

[export]
# the level re-matched (2026-10-27, design log step 177): the plugin starts at Player with all keys
# spread; the phrase's midpoint of Recording and Player lay +1.3 dB re the grands' (step 173's phrase)
output_gain_db = -1.5

[[part]]
id = "upright_c"

[[part.source]]
id = "upright_c"
role = "main"
root = "livingroom-upright"
# p (vel 0–86) and f (87–127), as the Knight's two layers: mf and ff
dynamics = { mf = "1/2", ff = "2/2" }
levels = "recorded"

# the attack regions that play with the pedal up (locc64 below 64), first round robin
[part.source.map]
kind = "sfz"
files = ["KeyPleezer LivingRoom Upright - Free Micro SFZ.sfz"]
filter = [{ opcode = "trigger", default = "attack", in = ["attack"] }, { opcode = "locc64", default = "0", lt = 64 }, { opcode = "seq_position", default = "1", in = ["1"] }]
layers = "rank"

# the unison toward the top key (2026-10-27, unison_check.py; the fits never see it): the fitted
# detune is measured from beats below the top octaves and held above them; the recording's beats
# (partials 1–3) grow to 2.3 cents at keys 102–107, the engine's stayed at 1.3; their ratio from
# key 78 up, a line in log: ×8.21 at 108; measured again on that export (three strings beat at
# their neighbors' gaps, half the spread): ×3.45, held at 12 (design log step 183)
[unison]
treble = [[78, 1.0], [108, 12.00]]

# the recordings' credit and terms (proto/license.py writes instruments/<project>/LICENSE.md)
[license]
set = "LivingRoom Upright Piano, Micro Edition for SFZ"
author = "Anders Eklöv (KeyPleezer)"
url = "https://keypleezer.com/livingroom-upright-piano/free-edition/micro-sfz/"
terms = "As material derived from it, this instrument is CC BY-SA 4.0 as well."
source_license = "CC-BY-SA-4.0"
