# Iowa MIS percussion (anechoic, 2013): octave runs split per note by analysis/split_runs.py
# the xylophone (no dampers): normal strokes with rosewood and hard rubber mallets
[project]
# recorded anechoic (Iowa MIS): the Compare page renders it without a room, as it was recorded
recorded_dry = true
family = "bars"
body = "xylophone"

[menu]
name = "Xylophone"
group = "Percussion"
# the mallets' names as the menu shows them (the file's are the fits' ids)
mallets = ["Rosewood", "Hard rubber"]

# the xylophone: the second mode tuned to 3 (the resonator's own second resonance), the third
# near 6, up to D♯5; above, untuned bars (2.4–2.8 and 5.5 falling to 4.3); a fourth near 10 on
# a few keys only, too short to fit
# its upper modes' losses from the analysis's short-window decays where the regular fit fails
[bars]
tracks = [1.0, 3.0, 6.0]
tol = [0.03, 0.18, 0.3]
scale_cutoff = true
fast_decays = true

[export]
# the level by loudness (2026-10-27, design log step 173): a phrase in its middle (an arpeggio at
# velocity 80, chords at 95) lay +1.3 dB re the grands' median (-28.9 LUFS, EBU R128); the
# calibration sets the median key's ff peak, and held tones sound louder than struck ones at one peak
gain_db = -1.5
motor = false

[[part]]
id = "xylophone"

[[part.source]]
id = "xylophone_rosewood"
role = "mallet"
mallet = "rosewood"
root = "iowa-mis-percussion"
dynamics = { pp = "pp", mf = "mf", ff = "ff" }
levels = "normalized"
# the Iowa runs: true levels within each octave run, each run at its own gain or touch (the
# marimba's yarn pp C6–B6 9 dB over the runs around it): level corrections within a run only
level_groups = "octave"

[part.source.map]
kind = "pattern"
glob = "notes/xylophone.rosewood/*/*.wav"
match = "relpath"
regex = 'notes/xylophone\.rosewood/(?P<dynamic>pp|mf|ff)/(?P<midi>\d+)\.wav'
note = { group = "midi", style = "midi" }
layers = ["pp", "mf", "ff"]
order = "layer"

[[part.source]]
id = "xylophone_hardrubber"
role = "mallet"
mallet = "hardrubber"
root = "iowa-mis-percussion"
dynamics = { pp = "pp", mf = "mf", ff = "ff" }
levels = "normalized"
# the Iowa runs: true levels within each octave run, each run at its own gain or touch (the
# marimba's yarn pp C6–B6 9 dB over the runs around it): level corrections within a run only
level_groups = "octave"

[part.source.map]
kind = "pattern"
glob = "notes/xylophone.hardrubber/*/*.wav"
match = "relpath"
regex = 'notes/xylophone\.hardrubber/(?P<dynamic>pp|mf|ff)/(?P<midi>\d+)\.wav'
note = { group = "midi", style = "midi" }
layers = ["pp", "mf", "ff"]
order = "layer"

# the recordings' credit and terms (proto/license.py writes instruments/<project>/LICENSE.md)
[license]
set = "University of Iowa Musical Instrument Samples: Xylophone"
author = "University of Iowa Electronic Music Studios"
url = "https://theremin.music.uiowa.edu/MISxylophone.html"
terms = "\"Since 1997, these recordings have been freely available on this website and may be downloaded and used for any projects, without restrictions.\" (https://theremin.music.uiowa.edu/MIS.html)"
source_license = "free-use"
