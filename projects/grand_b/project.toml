[project]
family = "struck"
skip = ["release_noise", "dampers", "pedal_noise"]
body = "grand"

[menu]
name = "Grand B"
group = "Grand pianos"

[strings]
design = "grand"
board_seed = 2
# Iowa beats like 1.35 cents (model ×1: 0.82, ×3: 2.08): see Salamander's project
detune = 1.8
# the highest partial number the soundboard fit uses (40 by default); the uprights and Iowa:
# 60 (their lowest octave came out 10–30 dB too dark at 2–4 kHz, where only partials above the
# 40th lie and C had no data)
id_max_partial = 60

[uses]
dampers = "grand_e"
release = "grand_a"
pedal = "grand_a"

[export]
# the level re-matched (2026-10-27, design log step 177): the plugin starts at Player with all keys
# spread; the phrase's midpoint of Recording and Player lay +0.8 dB re the grands' (step 173's phrase)
output_gain_db = -1.0

[[part]]
id = "grand_b"

[[part.source]]
id = "grand_b"
role = "main"
root = "iowa-mis-piano"
dynamics = { pp = "pp", mf = "mf", ff = "ff" }
# Iowa: steps of 6–18 dB between its layers and register levels the model follows note by
# note, so its levels are the recorded ones too
levels = "recorded"
# left out by ear (2026-10-16): the ff A0, B♭0 and B0 start late, after silence, and are the wrong
# notes; the pp C1 is a B0 (the pp B0 is a good take)
skip_files = ["Piano.ff.A0.aiff", "Piano.ff.Bb0.aiff", "Piano.ff.B0.aiff", "Piano.pp.C1.aiff"]

[part.source.map]
kind = "pattern"
glob = "*.aiff"
regex = 'Piano\.(?P<dynamic>pp|mf|ff)\.(?P<note>[A-G]b?\d)\.aiff'
note = { group = "note" }
layers = ["pp", "mf", "ff"]
order = "path"

# the export voices the piano to one level curve, as a voicer leaves it (design log step 138): each
# key's ff level corrected to a smooth trend through the keys' levels; the board's character stays
# in each key's tone. Heard as "a lot cleaner … mint condition" (2026-10-21); the Condition's
# Normal zone adds the unevenness back at runtime (the voicing's level scatter, step 139)
[even_levels]
window_keys = 9

# the felt set by ear (2026-10-22; the fits never see it): at the played mf/ff velocities the bass and
# middle opened ~8 dB more from mf to ff at 2–4 kHz than the recording ("very hard and jagged"); the
# exponent 1.7 matches that swing, but alone it sat darker than every recorded grand at ff (2–4 kHz
# −35.7 dB re 200–500 Hz against their −17 … −26: "more like an upright"); the stiffer felt brings it
# back, the user's choice +2.5 dB (heard +5.5 dB as "a little more like a grand again", but excessive)
# then solved with pp, mf and ff together (2026-10-22): the by-ear pair left mf 8 dB dark at 1–2 kHz,
# the bass and middle 7–9 dB heavy below 1 kHz re the recording ("boomy" on a Schubert Impromptu);
# solved: every layer within 3 dB, the boom down ~4 dB ("much better")
[felt]
p = 1.88
stiffness_db = 6.1

# the unison set by ear (2026-10-22; the fits never see it): the fitted detune ([strings] detune 1.8)
# beat 25–60 % faster than the recording in partials 1–6 (A3–D♯5, 0.3–12 s; e.g. the 3rd partial
# 0.95 Hz against 0.60) and partials 4–6 ~1 dB deeper, heard as a worn "wobble" once the softer felt
# uncovered it; the plugin's Unison width at 60 % fixed it by ear
# the unison toward the top key (2026-10-27, unison_check.py; the fits never see it): the fitted
# detune is measured from beats below the top octaves and held above them; the recording's beats
# (partials 1–3) grow to 6.1 cents at keys 102–107, the engine's stayed at 1.6; their ratio from
# key 78 up, a line in log: ×3.60 at 108; measured again on that export (three strings beat at
# their neighbors' gaps, half the spread): ×2.45 (design log step 183)
[unison]
width = 0.6
treble = [[78, 1.0], [108, 8.82]]

# the board's tone by ear (2026-10-22; the fits never see it): within a note, re the band of its
# fundamental, the treble's upper partials sat +3.7/+7.1 dB (mf/ff, 4 kHz) over the recording and the
# bass's 125 Hz +3.5/+3.3 dB; trimmed per register (keys: from 0 to full) to 0.0/+3.0 and +1.2/+1.2 dB,
# the middle left alone. The treble heard as an improvement, the bass not heard (kept: nearer the recording)
[board]
trim_db = [[125.0, -3.5, 52.0, 40.0], [4000.0, -5.0, 60.0, 72.0]]
# the board's low modes ring longer (2026-10-27, by ear on Grands A and B; the fits never see it):
# at loss factor 4 % where that rings longer than the fitted overlap, below 450 Hz; the board's own
# response 0.45–0.6 s below 200 Hz (was ~0.15 s), a grand's board glued into its rim ~0.5 s (Plath)
# (design log step 184)
low_eta = 0.04

# the recordings' credit and terms (proto/license.py writes instruments/<project>/LICENSE.md)
[license]
set = "University of Iowa Musical Instrument Samples: Piano"
author = "University of Iowa Electronic Music Studios"
url = "https://theremin.music.uiowa.edu/MISpiano.html"
terms = "\"Since 1997, these recordings have been freely available on this website and may be downloaded and used for any projects, without restrictions.\" (https://theremin.music.uiowa.edu/MIS.html)"
source_license = "free-use"
