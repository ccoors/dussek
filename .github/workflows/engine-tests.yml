# The engine's suite: about 5 min on every core of a desktop, longer on a runner. Nightly, and by hand
# from the Actions tab.
name: Engine tests

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine -> target
      - name: The engine's suite
        run: just test-engine
