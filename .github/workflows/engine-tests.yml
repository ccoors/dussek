# The engine's suite alone: about 6 min on every core of a desktop, 40 min on a runner. CI runs it
# on main and pull requests (ci.yml); this is for a branch, by hand from the Actions tab (locally:
# just test-engine).
name: Engine tests

on:
  workflow_dispatch:

jobs:
  engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 90  # 40 min on a 4-core runner (2026-10-31)
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine -> target
      - name: The engine's suite
        run: just test-engine
