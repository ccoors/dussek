# Every push and pull request: the build, the plugin's UI tests, the prototype's and the editor's
# suites, and the checks a commit needs. The engine's suite runs in engine-tests.yml (nightly).
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: System packages (DPF's, the editor's audio)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build pkg-config \
            libgl-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libdbus-1-dev \
            libjack-jackd2-dev libasound2-dev libpulse-dev locales
          # a comma-decimal locale: the UI state's and the presets' numbers are tested under it
          sudo locale-gen de_DE.UTF-8
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            engine -> target
            editor -> target
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build (engine, plugin, editor)
        run: just build
      - name: The plugin's UI tests
        run: just test-plugin
      - name: The standalone renders as midi2wav does
        run: |
          plugin/build/bin/pianoengine render instruments/grand_a albums/demos/midi/03-glass-rain.mid render.wav --tail 1
          engine/target/release/midi2wav instruments/grand_a albums/demos/midi/03-glass-rain.mid midi2wav.wav --tail 1
          cmp render.wav midi2wav.wav
      - name: The prototype's suite
        run: just test-proto
      - name: The editor's suite
        run: just test-editor
      - name: Nothing stale
        run: just check

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine -> target
      - name: Build the plugin (and the engine)
        run: just plugin
      - name: The plugin's UI tests
        run: plugin/build/ui_tests
      - name: The standalone renders
        run: |
          bin=plugin/build/bin/pianoengine
          [ -e "$bin" ] || [ -e "$bin.exe" ] || bin=plugin/build/bin/pianoengine.app/Contents/MacOS/pianoengine
          "$bin" render instruments/grand_a albums/demos/midi/03-glass-rain.mid render.wav --tail 1
          test -s render.wav

  windows:
    runs-on: windows-2025
    defaults:
      run:
        shell: msys2 {0}
    env:
      CMAKE_GENERATOR: Ninja
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          path-type: inherit
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf
      - name: Rust for MinGW (x86_64-pc-windows-gnu)
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal
          rustup default stable-x86_64-pc-windows-gnu
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine -> target
      - name: Build the plugin (and the engine)
        run: just plugin
      - name: The plugin's UI tests
        run: plugin/build/ui_tests
      - name: The standalone renders
        run: |
          bin=plugin/build/bin/pianoengine
          [ -e "$bin" ] || [ -e "$bin.exe" ] || bin=plugin/build/bin/pianoengine.app/Contents/MacOS/pianoengine
          "$bin" render instruments/grand_a albums/demos/midi/03-glass-rain.mid render.wav --tail 1
          test -s render.wav
