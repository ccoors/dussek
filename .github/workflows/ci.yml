# Linux, for main and pull requests (a branch is tested locally, `just test`; by hand here from the
# Actions tab): the build, the plugin's UI tests, the prototype's and the editor's suites, and the
# checks a commit needs. macOS and Windows: platforms.yml; the engine's suite: engine-tests.yml.
# The repository is private for now, where Actions' minutes count (macOS 10x, Windows 2x).
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: System packages (DPF's, the editor's audio)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build pkg-config \
            libgl-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libdbus-1-dev \
            libjack-jackd2-dev libasound2-dev libpulse-dev locales
          # a comma-decimal locale: the UI state's and the presets' numbers are tested under it
          sudo locale-gen de_DE.UTF-8
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            engine -> target
            editor -> target
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build (engine, plugin, editor)
        run: just build
      - name: The plugin's UI tests
        run: just test-plugin
      - name: The standalone renders as midi2wav does
        run: |
          plugin/build/bin/dussek render instruments/grand_a albums/demos/midi/03-glass-rain.mid render.wav --tail 1
          engine/target/release/midi2wav instruments/grand_a albums/demos/midi/03-glass-rain.mid midi2wav.wav --tail 1
          cmp render.wav midi2wav.wav
      - name: The prototype's suite
        run: just test-proto
      - name: The editor's suite
        run: just test-editor
      - name: Nothing stale
        run: just check
