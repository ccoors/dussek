# Linux, for main and pull requests (a branch is tested locally, `just test`; by hand here from the
# Actions tab): the build, the plugin's UI tests, the prototype's and the editor's suites, the checks
# a commit needs, and beside them the engine's suite (its own job, ~40 min). macOS and Windows:
# platforms.yml; the engine's suite alone, by hand: engine-tests.yml.
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash   # bash -eo pipefail: a failing script before a pipe fails its step

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: System packages (DPF's, the editor's audio)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build pkg-config \
            libgl-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libdbus-1-dev \
            libjack-jackd2-dev libasound2-dev libpulse-dev locales
          # a comma-decimal locale: the UI state's and the presets' numbers are tested under it
          sudo locale-gen de_DE.UTF-8
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            engine -> target
            editor -> target
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements.txt -r site/requirements.txt
      - name: Build (engine, plugin, editor)
        run: just build
      - name: The plugin's UI tests
        run: just test-plugin
      - name: The standalone renders as midi2wav does
        run: |
          plugin/build/bin/dussek render instruments/grand_a albums/demos/midi/03-glass-rain.mid render.wav --tail 1
          engine/target/release/midi2wav instruments/grand_a albums/demos/midi/03-glass-rain.mid midi2wav.wav --tail 1
          cmp render.wav midi2wav.wav
      - name: Weidinger's standalone renders as midi2wav does
        run: |
          plugin/build/bin/weidinger render instruments/trumpet albums/demos/midi/03-glass-rain.mid wrender.wav --tail 1
          engine/target/release/midi2wav instruments/trumpet albums/demos/midi/03-glass-rain.mid wmidi2wav.wav --tail 1
          cmp wrender.wav wmidi2wav.wav
      # a build to try on another machine (Actions tab: the run's artifacts; kept 3 days)
      - name: Package
        if: github.event_name != 'pull_request'
        run: |
          out=$(plugin/tools/package.sh linux | tail -n 1)
          tar -C dist -czf dist/dussek-linux.tar.gz "$(basename "$out")"   # tar keeps the executables' mode
      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        with:
          name: dussek-linux.tar.gz
          path: dist/dussek-linux.tar.gz
          archive: false   # the tarball itself, not a zip around it
          retention-days: 3
      - name: The prototype's suite
        run: just test-proto
      - name: The editor's suite
        run: just test-editor
      - name: Nothing stale
        run: just check

  engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 90  # 40 min on a 4-core runner (2026-10-31)
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine -> target
      - name: The engine's suite
        run: just test-engine
